# nfpm config for the deb and rpm packages. Driven by package.sh, which sets:
# Content entries use "expand: true" so nfpm expands the variables in src.
#   NASTRO_VERSION  e.g. 0.1.0 or 0.1.0-rc.1 (nfpm maps the pre-release to 0.1.0~rc.1)
#   NASTRO_ARCH     amd64 or arm64 (Go style, nfpm converts it for rpm)
#   NASTRO_BIN      path to the nastro binary
#   NASTRO_ROOT     repo root
name: nastro
arch: ${NASTRO_ARCH}
platform: linux
version: ${NASTRO_VERSION}
version_schema: semver
section: sound
priority: optional
maintainer: Estanislao Pérez Nartallo <tanisperez@gmail.com>
description: |
  A lightweight, skinnable desktop music player.
  Nastro is an open source music player written in Rust. Player, equalizer and
  playlist dock together, and the look is a skin. No login, no cloud, no telemetry.
vendor: Nastro
# Provisional website (pending decision, see AGENTS.md).
homepage: https://nastro.tanis.codes
license: Apache-2.0

contents:
  - src: ${NASTRO_BIN}
    dst: /usr/bin/nastro
    expand: true
    file_info:
      mode: 0755
  - src: ${NASTRO_ROOT}/packaging/linux/codes.tanis.nastro.desktop
    dst: /usr/share/applications/codes.tanis.nastro.desktop
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/nastro.svg
    dst: /usr/share/icons/hicolor/scalable/apps/codes.tanis.nastro.svg
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  - src: ${NASTRO_ROOT}/packaging/icons/png/nastro-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/codes.tanis.nastro.png
    expand: true
    file_info:
      mode: 0644
  # deb convention: the license under /usr/share/doc/<name>/ (as "copyright"-like file)
  - src: ${NASTRO_ROOT}/LICENSE
    dst: /usr/share/doc/nastro/LICENSE
    expand: true
    file_info:
      mode: 0644
    packager: deb
  - src: ${NASTRO_ROOT}/NOTICE
    dst: /usr/share/doc/nastro/NOTICE
    expand: true
    file_info:
      mode: 0644
    packager: deb
  # rpm convention: /usr/share/licenses/<name>/, flagged as a license file
  - src: ${NASTRO_ROOT}/LICENSE
    dst: /usr/share/licenses/nastro/LICENSE
    expand: true
    type: license
    file_info:
      mode: 0644
    packager: rpm
  - src: ${NASTRO_ROOT}/NOTICE
    dst: /usr/share/licenses/nastro/NOTICE
    expand: true
    type: license
    file_info:
      mode: 0644
    packager: rpm

# Runtime libraries the binary links (libxcb, libxkbcommon, libxkbcommon-x11) or loads with
# dlopen (wayland-client, wayland-egl, EGL; the names embedded in the binary). libasound (ALSA) is
# linked by the audio output (cpal). Vulkan is only a
# recommendation: wgpu can use it, but the binary does not name it. Names differ between deb and
# rpm.
depends:
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libxcb1
  - libwayland-client0
  - libwayland-egl1
  - libegl1
  - libasound2
recommends:
  - libvulkan1
overrides:
  rpm:
    depends:
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - libwayland-client
      - libwayland-egl
      - libglvnd-egl
      - alsa-lib
    recommends:
      - vulkan-loader
